# Environment: the Barrel distillery desk, one Python App (environment.py:Barrel)
# over a deterministic simulator in barrel_sim/. README.md explains the design.
name: barrel
version: 0.1.0
description: Run a craft whiskey distillery's maturing stock for 10 years (40 quarters).
overview: >-
  Decide fills, sampling, bottling ages, distributor allocations, bulk cask trades and
  inventory financing each quarter; outcome is cash at year 10 plus maturing stock
  marked on a fixed schedule from hidden true cask quality, minus debt.
python: environment.py:Barrel
readme: README.md

# No resources: barrel_sim/ ships inside the Environment's source package. Staging it
# as resources would put hidden dynamics where an Agent could read them.

runtime:
  provider: local
  timeout_seconds: 7500

harness_policy:
  mode: allow_all

# 0.23.1+: max_turns may be null (no cap). ~9 turns/quarter x 40 = ~360 turns.
# Time and spend still bound every episode.
limits:
  max_turns: null
  max_seconds: 7200
  max_cost_usd: 40
