# Harness: plays a scripted Barrel policy through the Environment's actions, calling
# no model. config.policy picks do_nothing, baseline or cellar; since 0.25.0 an
# Agent's harness_config overrides it, so one Harness serves three Agents.
name: barrel-scripted
version: 0.1.0
description: Scripted Barrel distillery policies without a model, for offline runs.
python: harness.py:BarrelScriptedHarness
readme: README.md
config:
  policy: baseline
