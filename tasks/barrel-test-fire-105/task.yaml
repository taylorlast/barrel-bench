# Task: one Barrel v2 world (realistic, scheduled fire). The scenario block
# controls every external factor: preset, master seed, per-factor seed/volatility/
# event_rate/enabled, and scheduled shocks. Same block => same world.
name: barrel-test-fire-105
version: 0.1.0
instructions: instruction.md
environment: barrel
verifiers:
- enterprise-value
initial_state:
  office:
    split: test
    scenario:
      preset: realistic
      master_seed: 105
      horizon_years: 7.0
      seed_capital: 2000000
      target_moic: 3.0
      factors:
        fire:
          enabled: false
      shocks:
      - week: 150
        event: warehouse_fire
        share: 0.3
