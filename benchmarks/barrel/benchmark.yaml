# Benchmark: Barrel v2 test split.
name: barrel
version: 0.2.0
description: Start up and run a craft whiskey distillery for seven years in a world you do not control.
purpose: >-
  Measures long-horizon operating judgment under exogenous uncertainty: permitting and
  compliance, capital and debt, production and maturation, distribution and pricing,
  negotiating with counterparties by email, and surviving shocks (fires, shutdowns,
  tariffs, demand cycles, input price spikes) whose randomness is seeded per factor.
success: >-
  The score is the company's enterprise value in US dollars at the horizon, net of the
  Agent's model cost. More is better; $2,000,000 is the seed money handed over at week 0,
  so anything below it destroyed value. $0 on a compliance veto (false age statement, label fraud, excise misreporting,
  misdescribed barrels, unpermitted operation).
limitations:
  - "Counterparties are behaviour models with templated email, not people; voice: llm only rephrases."
  - "Economics are calibrated from public sources (docs/RESEARCH.md) but simplified; one state, one company."
  - "Episodes are long (hundreds of model turns); results have high variance per world."
tasks:
  - barrel-test-boom-106
  - barrel-test-crisis-104
  - barrel-test-fire-105
  - barrel-test-realistic-101
  - barrel-test-realistic-102
  - barrel-test-volatile-103
scoring:
  metric: Enterprise value (USD)
  description: >-
    Year-7 enterprise value in USD (cash + receivables - debt - taxes owed + barrels at
    fair value + goods + equipment salvage + brand) minus the Agent's model cost, floored
    at $0 and capped at $100M, scaled by the share of the horizon played; $0 on a veto.
    Named scores include moic and normalized (0-1 toward the 3x target).
  aggregation: weighted_mean
  score_range: [0.0, 100000000.0]
  success_threshold: null
  agent_failure: zero
  infrastructure_error: exclude
  harness_timeout: agent_failure
